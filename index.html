
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duck form</Form></title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link href="styles/index.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">

</head>
<body>
    
        <form class="full-form">
                    <label class="label">Full Name</label>
                    <input type="text" placeholder="Enter your name" class="placeholder">

                    <label class="label">Email Address</label>
                    <input type="email" placeholder="Enter your email" class="placeholder">

                    <label class="label">Message Regarding</label>
                    <select name="Message Regarding" id="select">
                    <option value="Account issues" class="option">Account issues</option>
                    <option value="Update details" class="option">Update details</option>
                    <option value="General queries" class="option">General queries</option>
                    </select>

                    <label class="label">Message</label>
                    <textarea name="Message" id="" cols="15" rows="3" placeholder="Enter your message" class="placeholder"></textarea>

                    <button type="submit">Submit</button>
        
        </form>


</body>
</html>
